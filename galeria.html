<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería — JessyIsCrafting</title>
<meta name="description" content="Un paseo visual por las piezas de JessyIsCrafting: artesanías, cuadros, dibujos y figuras, además de momentos del taller.">
<link rel="canonical" href="https://jessicamrey.github.io/jessyiscrafting/galeria.html">
<link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#37472f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div data-include="header"></div>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" data-i18n="gallery.eyebrow">Galería</span>
      <h1 data-i18n="gallery.title">Un paseo por el taller</h1>
      <p data-i18n="gallery.subtitle">Piezas terminadas, procesos a medio camino y algún que otro momento detrás de la mesa de trabajo. Toca cualquier imagen para verla más grande.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="gallery-grid">
        <figure>
          <img src="assets/img/figuras/caballero-henry-1.jpg" alt="Figura de caballero medieval pintada a mano" loading="lazy" data-lightbox="assets/img/figuras/caballero-henry-1.jpg">
          <figcaption data-i18n="gallery.captions.caballero">Miniatura de caballero, pintada a pincel fino.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/cuadros/minas-tirith-1.jpg" alt="Cuadro al óleo de una ciudadela entre montañas" loading="lazy" data-lightbox="assets/img/cuadros/minas-tirith-1.jpg">
          <figcaption data-i18n="gallery.captions.minasTirith">Óleo sobre lienzo, ciudadela entre montañas.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/artesanias/farkle-set-2.jpg" alt="Detalle de caja de madera tallada" loading="lazy" data-lightbox="assets/img/artesanias/farkle-set-2.jpg">
          <figcaption data-i18n="gallery.captions.farkleDetalle">Detalle del escudo tallado a mano.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/dibujos/luminoso-1.jpg" alt="Ilustración digital de una armadura y un caballo blanco" loading="lazy" data-lightbox="assets/img/dibujos/luminoso-1.jpg">
          <figcaption data-i18n="gallery.captions.luminoso">Ilustración digital, luz entre la niebla.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/figuras/jinete-heraldico-1.jpg" alt="Figura de jinete con escudo heráldico" loading="lazy" data-lightbox="assets/img/figuras/jinete-heraldico-1.jpg">
          <figcaption data-i18n="gallery.captions.jinete">Diorama de jinete, base pintada a mano.</figcaption>
        </figure>
        <figure>
          <div class="placeholder-tile">
            <span data-i18n="gallery.placeholder1">📷 Foto del taller — próximamente</span>
          </div>
        </figure>
        <figure>
          <img src="assets/img/dibujos/escena-heinrich-1.jpg" alt="Ilustración digital de una escena de interior medieval" loading="lazy" data-lightbox="assets/img/dibujos/escena-heinrich-1.jpg">
          <figcaption data-i18n="gallery.captions.heinrich">Escena narrativa, ilustración digital.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/figuras/lune-1.jpg" alt="Figura pintada con efectos de fuego y cristal" loading="lazy" data-lightbox="assets/img/figuras/lune-1.jpg">
          <figcaption data-i18n="gallery.captions.lune">Figura con peana de efectos, pintura por encargo.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/cuadros/rincon-del-bosque-1.jpg" alt="Cuadro al óleo de un riachuelo en el bosque" loading="lazy" data-lightbox="assets/img/cuadros/rincon-del-bosque-1.jpg">
          <figcaption data-i18n="gallery.captions.bosque">Óleo sobre lienzo, un rincón de bosque.</figcaption>
        </figure>
        <figure>
          <div class="placeholder-tile">
            <span data-i18n="gallery.placeholder2">📷 Preparando un pedido — próximamente</span>
          </div>
        </figure>
        <figure>
          <img src="assets/img/figuras/renoir-1.jpg" alt="Figura de personaje con abrigo largo" loading="lazy" data-lightbox="assets/img/figuras/renoir-1.jpg">
          <figcaption data-i18n="gallery.captions.renoir">Figura de coleccionista, acabado mate.</figcaption>
        </figure>
        <figure>
          <img src="assets/img/artesanias/mini-farkle-1.jpg" alt="Set de viaje de Farkle en miniatura" loading="lazy" data-lightbox="assets/img/artesanias/mini-farkle-1.jpg">
          <figcaption data-i18n="gallery.captions.miniFarkle">Mini Farkle de viaje, listo para la mochila.</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>

<div data-include="footer"></div>

<script src="js/include.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
