<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title-key="shop.title">Tienda online · JessyIsCrafting</title>
  <meta name="description" data-i18n-desc-key="shop.metaDescription" content="Descubre artesanías, dibujo digital, cuadros y figuras pintadas a mano, hechas con cariño y disponibles para pedido.">
  <meta name="theme-color" content="#3F5A43">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://jessicamoradogetronics.github.io/jessyiscraftingGE/shop/index.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JessyIsCrafting">
  <meta property="og:image" content="https://jessicamoradogetronics.github.io/jessyiscraftingGE/assets/images/placeholders/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base="../" data-page-id="shop">
  <a class="skip-link" href="#main" data-i18n="nav.skipToContent">Ir al contenido principal</a>
  <div data-include="header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="section-heading">
          <span class="eyebrow" data-i18n="nav.shop">Tienda</span>
          <h1 data-i18n="shop.title">Tienda online</h1>
          <p class="lede" data-i18n="shop.intro">Cada pieza está hecha a mano.</p>
        </div>

        <div class="grid grid--2">
          <a class="category-tile" href="crafts.html">
            <img src="../assets/images/placeholders/category-crafts.svg" data-i18n-alt="categories.crafts.name" alt="Artesanías" width="800" height="600">
            <div class="category-tile__overlay">
              <h3 data-i18n="categories.crafts.name">Artesanías</h3>
              <span data-i18n="shop.viewCategory">Ver categoría</span>
            </div>
          </a>
          <a class="category-tile" href="digital-art.html">
            <img src="../assets/images/placeholders/category-digital-art.svg" data-i18n-alt="categories.digitalArt.name" alt="Dibujo digital" width="800" height="600">
            <div class="category-tile__overlay">
              <h3 data-i18n="categories.digitalArt.name">Dibujo digital</h3>
              <span data-i18n="shop.viewCategory">Ver categoría</span>
            </div>
          </a>
          <a class="category-tile" href="paintings.html">
            <img src="../assets/images/placeholders/category-paintings.svg" data-i18n-alt="categories.paintings.name" alt="Cuadros" width="800" height="600">
            <div class="category-tile__overlay">
              <h3 data-i18n="categories.paintings.name">Cuadros</h3>
              <span data-i18n="shop.viewCategory">Ver categoría</span>
            </div>
          </a>
          <a class="category-tile" href="figures.html">
            <img src="../assets/images/placeholders/category-figures.svg" data-i18n-alt="categories.figures.name" alt="Figuras" width="800" height="600">
            <div class="category-tile__overlay">
              <h3 data-i18n="categories.figures.name">Figuras</h3>
              <span data-i18n="shop.viewCategory">Ver categoría</span>
            </div>
          </a>
        </div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container text-center">
        <h2 data-i18n="shop.howToBuyTitle">¿Cómo comprar?</h2>
        <p class="lede" style="max-width:640px; margin-inline:auto;" data-i18n="shop.howToBuyText">Escríbeme indicando la pieza que te interesa.</p>
        <a class="btn btn-primary" href="../contact.html" data-i18n="shop.howToBuyCta">Consultar disponibilidad</a>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
