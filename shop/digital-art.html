<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title-key="categories.digitalArt.name">Dibujo digital · JessyIsCrafting</title>
  <meta name="description" data-i18n-desc-key="categories.digitalArt.metaDescription" content="Ilustraciones digitales, retratos y piezas personalizadas creadas trazo a trazo.">
  <meta name="theme-color" content="#3F5A43">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://jessicamoradogetronics.github.io/jessyiscraftingGE/shop/digital-art.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JessyIsCrafting">
  <meta property="og:image" content="https://jessicamoradogetronics.github.io/jessyiscraftingGE/assets/images/placeholders/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base="../" data-page-id="shop">
  <a class="skip-link" href="#main" data-i18n="nav.skipToContent">Ir al contenido principal</a>
  <div data-include="header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <p><a href="index.html">&larr; <span data-i18n="shop.backToShop">Volver a la tienda</span></a></p>
        <div class="section-heading section-heading--left">
          <span class="eyebrow" data-i18n="nav.shop">Tienda</span>
          <h1 data-i18n="categories.digitalArt.name">Dibujo digital</h1>
          <p class="lede" data-i18n="categories.digitalArt.intro">Ilustraciones digitales y piezas personalizadas.</p>
        </div>

        <div class="example-notice" data-i18n="common.exampleDataNote">Los productos mostrados son ejemplos de muestra.</div>

        <div class="grid grid--3" data-product-grid="digitalArt"></div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="product-modal"></div>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    function renderDigitalArtGrid() {
      productsApi.renderGrid(document.querySelector("[data-product-grid]"), "digitalArt");
    }
    document.addEventListener("app:ready", function () {
      productsApi.load().then(renderDigitalArtGrid);
    });
    document.addEventListener("i18n:changed", renderDigitalArtGrid);
  </script>
</body>
</html>
